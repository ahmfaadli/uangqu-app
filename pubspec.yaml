name: uangquapp
description: "Aplikasi keuangan pribadi UangQu."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  sqflite: ^2.4.4
  path: ^1.9.1
  intl: ^0.20.3
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Untuk membuat icon aplikasi Android
  flutter_launcher_icons: ^0.14.4

  # Untuk membuat splash screen
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

  # Asset aplikasi
  assets:
    - assets/images/uangqu_logo.png


# ============================================================
# APP ICON
# ============================================================

flutter_launcher_icons:
  android: true
  ios: false

  # Logo utama
  image_path: "assets/images/uangqu_logo.png"

  # Adaptive icon Android
  adaptive_icon_background: "#0D47A1"
  adaptive_icon_foreground: "assets/images/uangqu_logo.png"

  # Bersihkan icon lama
  remove_alpha_ios: true


# ============================================================
# SPLASH SCREEN
# ============================================================

flutter_native_splash:
  # Warna background splash
  color: "#0D47A1"

  # Logo yang muncul saat aplikasi dibuka
  image: "assets/images/uangqu_logo.png"

  # Android
  android: true

  # Tidak digunakan karena aplikasi ditujukan untuk Android
  ios: false

  # Konfigurasi Android 12+
  android_12:
    color: "#0D47A1"
    image: "assets/images/uangqu_logo.png"